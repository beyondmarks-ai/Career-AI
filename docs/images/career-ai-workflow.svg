<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Career AI user workflow</title>
  <desc id="desc">A five-step workflow from resume upload through personalized report, learning resources, and job recommendations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c35"/>
      <stop offset="1" stop-color="#115b77"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2166f3"/>
      <stop offset="1" stop-color="#39c7dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071c35" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#f4f7fb"/>
  <rect x="28" y="28" width="1144" height="334" rx="24" fill="url(#bg)"/>
  <text x="70" y="82" fill="#65d8eb" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HOW CAREER AI WORKS</text>
  <text x="70" y="119" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">From resume to focused career action in one flow</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 165)">
      <rect width="190" height="145" rx="18" fill="#ffffff"/>
      <circle cx="28" cy="28" r="15" fill="#eaf1ff"/><text x="28" y="33" text-anchor="middle" fill="#2166f3" font-size="13" font-weight="700">1</text>
      <text x="22" y="70" fill="#0b2545" font-size="17" font-weight="700">Upload resume</text>
      <text x="22" y="96" fill="#607087" font-size="13">PDF or DOCX, including</text>
      <text x="22" y="116" fill="#607087" font-size="13">scanned documents</text>
    </g>
    <g transform="translate(288 165)">
      <rect width="190" height="145" rx="18" fill="#ffffff"/>
      <circle cx="28" cy="28" r="15" fill="#e9f8f5"/><text x="28" y="33" text-anchor="middle" fill="#16a085" font-size="13" font-weight="700">2</text>
      <text x="22" y="70" fill="#0b2545" font-size="17" font-weight="700">Azure extraction</text>
      <text x="22" y="96" fill="#607087" font-size="13">Read layout, OCR text,</text>
      <text x="22" y="116" fill="#607087" font-size="13">and candidate identity</text>
    </g>
    <g transform="translate(506 165)">
      <rect width="190" height="145" rx="18" fill="#ffffff"/>
      <circle cx="28" cy="28" r="15" fill="#f0edff"/><text x="28" y="33" text-anchor="middle" fill="#7657e8" font-size="13" font-weight="700">3</text>
      <text x="22" y="70" fill="#0b2545" font-size="17" font-weight="700">Grounded RAG</text>
      <text x="22" y="96" fill="#607087" font-size="13">Retrieve relevant evidence</text>
      <text x="22" y="116" fill="#607087" font-size="13">for the target role</text>
    </g>
    <g transform="translate(724 165)">
      <rect width="190" height="145" rx="18" fill="#ffffff"/>
      <circle cx="28" cy="28" r="15" fill="#fff3e8"/><text x="28" y="33" text-anchor="middle" fill="#ef7d45" font-size="13" font-weight="700">4</text>
      <text x="22" y="70" fill="#0b2545" font-size="17" font-weight="700">Career report</text>
      <text x="22" y="96" fill="#607087" font-size="13">Scores, strengths, gaps,</text>
      <text x="22" y="116" fill="#607087" font-size="13">skills, and action plan</text>
    </g>
    <g transform="translate(942 165)">
      <rect width="190" height="145" rx="18" fill="#ffffff"/>
      <circle cx="28" cy="28" r="15" fill="#e8f7fb"/><text x="28" y="33" text-anchor="middle" fill="#177a9a" font-size="13" font-weight="700">5</text>
      <text x="22" y="70" fill="#0b2545" font-size="17" font-weight="700">Take action</text>
      <text x="22" y="96" fill="#607087" font-size="13">Open learning resources</text>
      <text x="22" y="116" fill="#607087" font-size="13">and live India jobs</text>
    </g>
  </g>
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M263 237h18"/><path d="M481 237h18"/><path d="M699 237h18"/><path d="M917 237h18"/>
  </g>
</svg>
