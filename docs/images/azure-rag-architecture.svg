<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Career AI Azure RAG architecture</title>
  <desc id="desc">Architecture showing Streamlit, Azure Document Intelligence, Azure OpenAI, Azure AI Search, learning providers, and Jooble.</desc>
  <defs>
