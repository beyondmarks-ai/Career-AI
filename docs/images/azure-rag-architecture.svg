    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#132238" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#7d93ab"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f4f7fb"/>
  <rect x="28" y="28" width="1144" height="84" rx="20" fill="url(#header)"/>
